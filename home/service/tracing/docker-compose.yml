services:
  jaeger:
    image: jaegertracing/all-in-one:1
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
      # Work around IPv6 ::1 not working on some docker desktop for mac installs by telling
      # the Jaeger tracer client that the all in one distribution creates for "jaeger-query"
      # to use IPv4.
      JAEGER_AGENT_HOST: 127.0.0.1
    labels:
      - traefik.enable=true
      - traefik.http.routers.my127ws-tracing-jaeger.rule=${TRAEFIK_TRACING_RULE}
      - traefik.http.services.my127ws-tracing-jaeger.loadbalancer.server.port=16686
      - traefik.docker.network=${TRAEFIK_NETWORK}
    restart: unless-stopped

networks:
  default:
    external:
      name: $TRAEFIK_NETWORK
