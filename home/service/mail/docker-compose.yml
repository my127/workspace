services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=${TRAEFIK_MAIL_RULE}
      - traefik.http.services.mail.loadbalancer.server.port=8025
    networks:
      - private
      - shared
networks:
  private:
    external: false
  shared:
    external:
      name: $TRAEFIK_NETWORK
